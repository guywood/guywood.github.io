{% assign p = include.post %}
<article class="post" id="post-{{ p.tumblr_id | default: p.slug }}">
  {% if p.image %}<a class="photo" href="{{ p.image | relative_url }}"><img src="{{ p.image | relative_url }}" alt="{{ p.title | escape }}"{% unless include.first %} loading="lazy"{% endunless %}></a>{% endif %}
  <div class="copy">{{ p.content }}</div>
  <div class="meta"><a href="{{ p.url | relative_url }}">{{ p.date | date: "%B %-d, %Y" }}</a></div>
</article>
