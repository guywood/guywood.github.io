---
layout: default
---
<div class="page">
  <main class="content">
    {% include post.html post=page first=true %}
    <nav class="prevnext">
      {% if page.next %}<a href="{{ page.next.url | relative_url }}">&larr; Newer</a>{% else %}<span></span>{% endif %}
      {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">Older &rarr;</a>{% endif %}
    </nav>
  </main>
  {% include sidebar.html %}
</div>
