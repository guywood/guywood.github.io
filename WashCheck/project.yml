# Optional XcodeGen spec. The checked-in WashCheck.xcodeproj is the primary project;
# this file only exists so `xcodegen generate` can rebuild it from scratch if you ever need to.
name: WashCheck
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  WashCheck:
    type: application
    platform: iOS
    sources:
      - path: WashCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.washcheck
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wash Check
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"WashCheck/Preview Content"'
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  WashCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WashCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.washcheck.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WashCheck:
    build:
      targets:
        WashCheck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WashCheckTests
