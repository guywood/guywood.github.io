---
layout: default
title: Archive
---
<div class="page archive">
  <main>
    {% assign years = site.posts | group_by_exp: "p", "p.date | date: '%Y'" %}
    {% for year in years %}
    <h2 class="month">{{ year.name }}</h2>
    <div class="grid">
      {% for p in year.items %}
      <a class="thumb" href="{{ p.url | relative_url }}">
        {% if p.image %}<img src="{{ p.image | relative_url }}" alt="{{ p.title | escape }}" loading="lazy">{% endif %}
        <span>{{ p.title }}<small>{{ p.date | date: "%B %-d, %Y" }}</small></span>
      </a>
      {% endfor %}
    </div>
    {% endfor %}
  </main>
</div>
