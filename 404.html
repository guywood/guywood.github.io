<div class="page"><main class="content"><article class="post notfound"><div class="copy"><p>That page isn’t here.</p><p><a href="{{ '/' | relative_url }}">Back to the photos</a></p></div></article></main></div>
<script>
  // Old Tumblr links (/post/<id>/<slug>, /image/<id>, /rss) go to their new homes.
  var path = location.pathname, m;
  if ((m = path.match(/^\/(?:post|image)\/(\d+)\/./) || path.match(/^\/image\/(\d+)/))) location.replace('/post/' + m[1] + '/');
  else if (/^\/rss\/?$/.test(path)) location.replace('/feed.xml');
  else if (/^\/archive$/.test(path)) location.replace('/archive/');
</script>
